# Disconnected side, step 3: install MicroShift on the three nodes from the distribution server and join them.
# node1 runs the control plane; node2 and node3 join it as workers.
- name: Install MicroShift from the distribution server
  hosts: nodes
  gather_facts: false
  become: true
  tasks:
    # The four client settings files are read from the distribution server and delivered over SSH.
    - name: Read the client settings from the distribution server
      ansible.builtin.slurp:
        src: "/var/www/html/client/{{ item }}"
      loop: [microshift-dist.repo, rootCA.pem, registries.conf, registries.d.yaml]
      delegate_to: dist
      run_once: true
      register: client_files

    - name: Install the repository settings and the certificate authority
      ansible.builtin.copy:
        content: "{{ client_files.results[item.index].content | b64decode }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - {index: 0, dest: /etc/yum.repos.d/microshift-dist.repo}
        - {index: 1, dest: /etc/pki/ca-trust/source/anchors/microshift-dist.pem}
      loop_control:
        label: "{{ item.dest }}"

    - name: Trust the distribution server's certificate authority
      ansible.builtin.command: update-ca-trust
      changed_when: false

    - name: Install MicroShift
      ansible.builtin.command: >-
        dnf install -y --disablerepo=* --enablerepo=microshift-dist {{ node_packages | join(' ') }}
      register: install
      changed_when: "'Nothing to do' not in install.stdout"

    # After the install: the folders these go into come with the packages.
    - name: Install the registry settings
      ansible.builtin.copy:
        content: "{{ client_files.results[item.index].content | b64decode }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - {index: 2, dest: /etc/containers/registries.conf.d/microshift-dist.conf}
        - {index: 3, dest: /etc/containers/registries.d/microshift-dist.yaml}
      loop_control:
        label: "{{ item.dest }}"

    - name: Start the firewall
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Trust the pod network and the other nodes
      ansible.builtin.command: firewall-cmd --permanent --zone=trusted --add-source={{ item }}
      loop:
        - 10.42.0.0/16
        - 169.254.169.1
        - "{{ lab_subnet }}.0/24"

    - name: Apply the firewall rules
      ansible.builtin.command: firewall-cmd --reload

    - name: Configure MicroShift
      ansible.builtin.copy:
        dest: /etc/microshift/config.d/10-lab.yaml
        mode: "0644"
        content: |
          apiServer:
            subjectAltNames:
              - {{ vms[inventory_hostname].ip }}
              - {{ inventory_hostname }}.{{ lab_domain }}
          telemetry:
            status: Disabled

    - name: Create the folder for the service override
      ansible.builtin.file:
        path: /etc/systemd/system/microshift.service.d
        state: directory
        mode: "0755"

    # Running more than one node is not supported by Red Hat (see the README).
    - name: Run MicroShift in multi-node mode
      when: multinode | bool
      ansible.builtin.copy:
        dest: /etc/systemd/system/microshift.service.d/multinode.conf
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=microshift run --multinode

    - name: Enable MicroShift
      ansible.builtin.systemd:
        name: microshift
        enabled: true
        daemon_reload: true

- name: Start the control plane
  hosts: nodes
  gather_facts: false
  become: true
  tasks:
    - name: Start the control plane
      when: runs_control_plane
      block:
        - name: Start MicroShift
          ansible.builtin.systemd:
            name: microshift
            state: started

        - name: Wait until MicroShift is healthy
          ansible.builtin.command: microshift healthcheck --timeout=600s
          changed_when: false

        - name: Read the kubeconfig the other nodes join with
          ansible.builtin.slurp:
            src: "/var/lib/microshift/resources/kubeadmin/{{ vms[inventory_hostname].ip }}/kubeconfig"
          register: join_kubeconfig
          when: multinode | bool
          no_log: true

- name: Join the workers
  hosts: workers
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: See whether the node has joined already
      ansible.builtin.stat:
        path: /var/lib/microshift/.joined
      register: joined

    - name: Join the node
      when: multinode | bool and not joined.stat.exists
      block:
        - name: Join with the control plane's kubeconfig
          block:
            - name: Copy the join kubeconfig
              ansible.builtin.copy:
                content: "{{ hostvars[groups['control_plane'][0]].join_kubeconfig.content | b64decode }}"
                dest: /root/kubeconfig-join
                mode: "0600"
              no_log: true

            - name: Add the node to the cluster
              ansible.builtin.command: microshift add-node --kubeconfig=/root/kubeconfig-join

            - name: Wait until the node is healthy
              ansible.builtin.command: microshift healthcheck --timeout=600s
              changed_when: false
          always:
            - name: Remove the join kubeconfig
              ansible.builtin.file:
                path: /root/kubeconfig-join
                state: absent

        - name: Mark the node as joined
          ansible.builtin.file:
            path: /var/lib/microshift/.joined
            state: touch
            mode: "0644"

- name: Check the cluster with a test application
  hosts: nodes
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /var/lib/microshift/resources/kubeadmin/kubeconfig
  tasks:
    - name: Check the cluster with a test application
      when: runs_control_plane
      block:
        - name: Give cloud-user a kubeconfig
          ansible.builtin.shell: |
            set -e
            mkdir -p /home/cloud-user/.kube
            cp /var/lib/microshift/resources/kubeadmin/kubeconfig /home/cloud-user/.kube/config
            chown -R cloud-user: /home/cloud-user/.kube
            chmod 600 /home/cloud-user/.kube/config
          changed_when: false

        - name: Wait for the nodes to be Ready
          ansible.builtin.command: oc wait node --all --for=condition=Ready --timeout=300s
          changed_when: false

        - name: Copy the test application
          ansible.builtin.copy:
            src: files/hello.yaml
            dest: /root/hello.yaml
            mode: "0644"

        - name: Deploy the test application, one pod per node
          ansible.builtin.command: oc apply -f /root/hello.yaml

        - name: Wait for its pods
          ansible.builtin.command: oc rollout status -n hello daemonset/hello --timeout=300s
          changed_when: false

        - name: List the nodes and the pods
          ansible.builtin.shell: oc get nodes -o wide && oc get pods -n hello -o wide
          register: summary
          changed_when: false

        - name: Report
          ansible.builtin.debug:
            msg: "{{ summary.stdout_lines }}"
