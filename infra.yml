# Disconnected side, step 1: a network with no way out, with the distribution server and three nodes on it.
- name: Create the disconnected network and its VMs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Prepare the workstation
      ansible.builtin.import_tasks: tasks/workstation.yml

    - name: Create the disconnected network
      ansible.builtin.include_tasks: tasks/network.yml
      vars:
        net_name: "{{ lab_network }}"
        net_template: files/network-lab.xml.j2

    - name: Create the VMs
      ansible.builtin.include_tasks: tasks/create-vm.yml
      loop: "{{ groups['dist'] + groups['nodes'] }}"
      loop_control:
        loop_var: vm_host

- name: Check the VMs
  hosts: dist:nodes
  gather_facts: false
  tasks:
    - name: Wait for the VM
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Set the host name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}.{{ lab_domain }}"
      become: true
